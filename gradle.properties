# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Fix for "jlink executable does not exist"
# This disables the generation of a local JDK image, which avoids the need for jlink
android.jdk.image.enabled=false
